<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Slide 10</title>
  <link rel="stylesheet" href="./common.css" />
</head>
<body>
  <div class="topbar"></div>
  <div class="header">
    <div class="section">프레임</div>
    <div class="slide-no">10</div>
  </div>

  <div class="title" style="margin-top: 28pt;">CRAFTO는 생각 정리 틀이다</div>
  <div class="subtitle">프롬프트 공식이 아니라, 내 생각을 빠뜨리지 않고 전달하는 구조다.</div>

  <div class="grid-3" style="margin-top: 24pt;">
    <div class="card blue soft-blue no-shadow">
      <div class="kicker">Context</div>
      <div class="card-title">지금 어떤 상황인가</div>
    </div>
    <div class="card navy no-shadow">
      <div class="kicker">Role</div>
      <div class="card-title">AI는 어떤 역할을 해야 하는가</div>
    </div>
    <div class="card green soft-green no-shadow">
      <div class="kicker">Audience</div>
      <div class="card-title">누가 이 결과를 보는가</div>
    </div>
    <div class="card gold soft-warm no-shadow">
      <div class="kicker">Format</div>
      <div class="card-title">어떤 형태로 받으면 바로 쓸 수 있는가</div>
    </div>
    <div class="card orange soft-coral no-shadow">
      <div class="kicker">Tone</div>
      <div class="card-title">어느 수준과 말투가 필요한가</div>
    </div>
    <div class="card navy no-shadow">
      <div class="kicker">Option</div>
      <div class="card-title">제약, 금지선, 선택 기준은 무엇인가</div>
    </div>
  </div>
  <div class="footer-line"></div>
</body>
</html>
