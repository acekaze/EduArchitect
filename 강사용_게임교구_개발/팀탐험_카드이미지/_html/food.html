<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body {
    width: 700px;
    height: 1000px;
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
  }
  .card {
    width: 700px;
    height: 1000px;
    position: relative;
    overflow: hidden;
    border: 4px solid rgba(24, 35, 33, 0.38);
    border-radius: 34px;
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.22)),
      var(--sub);
    padding: 62px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 32px;
    border: 2px solid rgba(255, 255, 255, 0.74);
    border-radius: 24px;
    pointer-events: none;
    z-index: 2;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 26% 22%, rgba(255, 255, 255, 0.52), transparent 34%),
      repeating-linear-gradient(34deg, transparent 0 82px, rgba(24, 35, 33, 0.04) 82px 87px);
    pointer-events: none;
    z-index: 1;
  }
  .card > * { position: relative; z-index: 3; }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 40px;
  }
  .label {
    color: var(--main);
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 1.22;
    text-transform: uppercase;
  }
  .score {
    width: 144px;
    height: 144px;
    border-radius: 50%;
    background: var(--main);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 18px 40px rgba(24, 35, 33, 0.24);
    flex: 0 0 auto;
  }
  .score strong {
    font-size: 72px;
    line-height: 0.92;
    font-weight: 900;
  }
  .score span {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.08em;
  }
  .visual {
    display: grid;
    place-items: center;
    text-align: center;
  }
  .icon-frame {
    width: 300px;
    height: 300px;
    display: grid;
    place-items: center;
    margin-bottom: 44px;
    border: 5px solid color-mix(in srgb, var(--main), white 18%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.34) 68%),
      color-mix(in srgb, var(--sub), white 18%);
  }
  .icon {
    width: 188px;
    height: 188px;
    color: var(--main);
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .name {
    font-size: 92px;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: 0;
    color: #182321;
  }
  .meaning {
    width: fit-content;
    margin: 28px auto 0;
    padding: 10px 32px;
    border: 3px solid color-mix(in srgb, var(--main), white 22%);
    border-radius: 999px;
    color: var(--main);
    background: rgba(255, 255, 255, 0.55);
    font-size: 34px;
    font-weight: 900;
  }
  .copy {
    min-height: 132px;
    padding: 0 20px 6px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    text-align: center;
    color: #182321;
    font-size: 42px;
    line-height: 1.35;
    font-weight: 800;
    word-break: keep-all;
  }
  .back {
    color: #fffaf2;
    background:
      radial-gradient(circle at 50% 38%, rgba(242, 218, 153, 0.12), transparent 42%),
      linear-gradient(145deg, #1f332d, #182621);
    align-items: center;
    justify-content: center;
    gap: 72px;
    text-align: center;
  }
  .back::before { border-color: rgba(255, 255, 255, 0.22); }
  .back::after {
    background:
      linear-gradient(90deg, transparent 0 47%, rgba(255, 255, 255, 0.08) 47% 53%, transparent 53% 100%),
      linear-gradient(0deg, transparent 0 47%, rgba(255, 255, 255, 0.08) 47% 53%, transparent 53% 100%);
    transform: rotate(18deg) scale(1.4);
  }
  .back-mark {
    width: 330px;
    height: 330px;
    color: #e7d8a6;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.92;
  }
  .back-title {
    font-size: 78px;
    line-height: 1.15;
    font-weight: 900;
    letter-spacing: 0.06em;
  }
</style></head>
<body>
  <article class="card" style="--main:#A7A06A; --sub:#EEEACB;">
    <div class="top">
      <div class="label">TEAM<br>EXPLORATION</div>
      <div class="score"><strong>1</strong><span>POINT</span></div>
    </div>
    <div class="visual">
      <div class="icon-frame"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M7 8h10l1 11H6L7 8z" />
    <path d="M9 8c0-3 6-3 6 0" />
    <path d="M9 12h6" />
    <path d="M10 16h4" />
  </svg></div>
      <div class="name">식량</div>
      <div class="meaning">지속</div>
    </div>
    <div class="copy">끝까지 갈 힘을 챙겼다.</div>
  </article>
</body>
</html>
