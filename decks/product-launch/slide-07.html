<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Slide 07</title>
  <link rel="stylesheet" href="./common.css" />
</head>
<body>
  <div class="topbar"></div>
  <div class="header">
    <div class="section">의사 비유</div>
    <div class="slide-no">07</div>
  </div>

  <div class="title" style="margin-top: 28pt;">진단 없이 처방부터 요구하진 않는다</div>
  <div class="subtitle">중요한 문제일수록 먼저 맥락을 설명하고, 전문가가 다시 질문하게 한다.</div>

  <div class="split" style="margin-top: 26pt;">
    <div class="card orange soft-coral no-shadow">
      <div class="kicker">잘못된 접근</div>
      <div class="card-title">이 자료 쉽게 설명해줘</div>
      <div class="card-body">바로 답을 요구한다.<br/>청자도 목적도 빠져 있다.<br/>결과는 그럴듯하지만 내 상황과 어긋날 수 있다.</div>
    </div>
    <div class="card green soft-green no-shadow">
      <div class="kicker">올바른 접근</div>
      <div class="card-title">지금 바로 답하지 말고,<br/>먼저 내가 무엇을 하려는지 질문해줘</div>
      <div class="card-body">맥락을 묻는다.<br/>누가 읽는지, 무엇을 놓치면 안 되는지 확인한다.<br/>그다음에야 더 맞는 구조와 판단 재료가 나온다.</div>
    </div>
  </div>
  <div class="footer-line"></div>
</body>
</html>
