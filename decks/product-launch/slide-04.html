<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Slide 04</title>
  <link rel="stylesheet" href="./common.css" />
</head>
<body>
  <div class="topbar"></div>
  <div class="header">
    <div class="section">의미 정렬</div>
    <div class="slide-no">04</div>
  </div>

  <div class="title" style="margin-top: 28pt;">예쁜 집은 사람마다 다르다</div>
  <div class="subtitle">같은 단어를 써도, 각자 떠올리는 기준은 전혀 다를 수 있다.</div>

  <div class="split" style="margin-top: 28pt;">
    <div class="card no-shadow">
      <div class="kicker">사례 A | 예쁜 집</div>
      <div class="card-title">채광이 좋은 집<br/>동선이 편한 집<br/>가족이 편안한 집</div>
      <div class="card-body">같은 '예쁜 집'이라도 각자 떠올리는 기준은 전혀 다르다.</div>
    </div>
    <div class="card blue soft-blue no-shadow">
      <div class="kicker">사례 B | 좋은 결과</div>
      <div class="card-title">한 번에 이해되는 보고<br/>다시 설명하지 않아도 되는 정리<br/>빠르게 결정되는 회의</div>
      <div class="card-body">그래서 AI에게 '좋게 해줘'라고만 하면 어긋나기 쉽다.</div>
    </div>
  </div>

  <div class="caption" style="margin-top: 22pt;">같은 말을 써도 같은 뜻이 아닐 수 있다. 좋은 AI 활용은 답을 빨리 받는 것보다 먼저 뜻을 맞추는 데서 시작한다.</div>
  <div class="footer-line"></div>
</body>
</html>
