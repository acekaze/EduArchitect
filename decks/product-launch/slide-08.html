<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Slide 08</title>
  <link rel="stylesheet" href="./common.css" />
</head>
<body>
  <div class="topbar"></div>
  <div class="header">
    <div class="section">추론 도구</div>
    <div class="slide-no">08</div>

  <div class="title" style="margin-top: 28pt;">AI는 정답 자판기인가, 추론 도구인가</div>

      <div class="kicker">Reason</div>
      <div class="card-title">비교하고 질문하고 점검한다</div>
      <div class="card-body">쟁점을 드러낸다<br/>구조를 세운다<br/>판단을 돕는다</div>
