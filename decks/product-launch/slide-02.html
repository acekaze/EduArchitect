<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Slide 02</title>
  <link rel="stylesheet" href="./common.css" />
</head>
<body>
  <div class="topbar"></div>
  <div class="header">
    <div class="section">4MAT 구조</div>
    <div class="slide-no">02</div>
  </div>

  <div class="title" style="margin-top: 28pt;">오늘은 이렇게 갑니다</div>
  <div class="subtitle">설명보다 작은 실습을 자주 넣고, 마지막에는 자기 업무 장면 하나로 종합한다.</div>

  <div class="timeline">
    <div class="item">
      <div class="dot">1</div>
      <div class="card blue soft-blue no-shadow">
        <div class="kicker">WHY</div>
        <div class="card-title lg">왜 AI를 써도 아직 답답한가</div>
      </div>
    </div>
    <div class="item">
      <div class="dot">2</div>
      <div class="card gold soft-warm no-shadow">
        <div class="kicker">WHAT</div>
        <div class="card-title lg">AI를 어떤 도구로 이해해야 하는가</div>
      </div>
    </div>
    <div class="item">
      <div class="dot" style="background:#bfd2ef; color:#fff;">3</div>
      <div class="card green soft-green no-shadow">
        <div class="kicker">HOW</div>
        <div class="card-title lg">어떻게 질문하고 구조화하고 점검할 것인가</div>
      </div>
    </div>
    <div class="item">
      <div class="dot" style="background:#8d9aaa;">4</div>
      <div class="card orange soft-coral no-shadow">
        <div class="kicker">IF</div>
        <div class="card-title lg">그래서 내 업무에 무엇을 적용할 것인가</div>
      </div>
    </div>
  </div>

  <div class="subtitle italic" style="margin-top: 26pt;">Why에서 문제를 열고, What에서 개념을 잡고, How에서 반복 실습을 돌리고, If에서 내 업무 적용으로 닫는다.</div>
  <div class="footer-line"></div>
</body>
</html>
