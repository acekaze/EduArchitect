<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: #eee7da;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
    }
    .wrap {
      width: 1500px;
      min-height: 1050px;
      padding: 42px;
    }
    h1 {
      margin: 0 0 26px;
      font-size: 42px;
      color: #182321;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 300px);
      gap: 28px;
    }
    img {
      width: 300px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 14px 26px rgba(47, 38, 25, 0.16);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>팀 탐험 카드 이미지 시안</h1>
    <div class="grid">
      <img src="../01_깃발_6점.png" alt="깃발">
      <img src="../02_나침반_5점.png" alt="나침반">
      <img src="../03_지도_4점.png" alt="지도">
      <img src="../04_랜턴_3점.png" alt="랜턴">
      <img src="../05_로프_2점.png" alt="로프">
      <img src="../06_식량_1점.png" alt="식량">
      <img src="../00_공통_뒷면.png" alt="공통 뒷면">
    </div>
  </div>
</body>
</html>
