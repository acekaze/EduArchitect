<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Slide 09</title>

<body>
  <div class="topbar"></div>
  <div class="header">
    <div class="section">철학</div>
    <div class="slide-no">09</div>
  </div>

  <div class="title" style="margin-top: 28pt;">이 과정의 철학</div>
  <div class="subtitle">기능보다 방향을 먼저 세워야 노하우가 얕아지지 않는다.</div>

  <div class="grid-3" style="margin-top: 28pt;">
    <div class="card blue soft-blue no-shadow">
      <div class="kicker">1</div>
      <div class="card-title">목적이 먼저다</div>
      <div class="card-body">AI 활용의 출발점은 답이 아니라 목적이다.</div>
    </div>
    <div class="card no-shadow">
      <div class="kicker">2</div>
      <div class="card-title">AI는 인터뷰와 점검의 파트너다</div>
      <div class="card-body">좋은 활용은 AI가 먼저 질문하고, 다시 피드백하는 흐름에서 나온다.</div>
    </div>
    <div class="card green soft-green no-shadow">
      <div class="kicker">3</div>
      <div class="card-title">핵심은 더 나은 판단과 실행이다</div>
      <div class="card-body">문서 한 개를 빨리 만드는 것보다, 더 정확히 판단하고 움직이는 것이 중요하다.</div>
    </div>
  </div>

  <div class="caption" style="margin-top: 22pt;">철학은 방향이고, 프레임은 지도이며, 노하우는 운전법이다.</div>
  <div class="footer-line"></div>
