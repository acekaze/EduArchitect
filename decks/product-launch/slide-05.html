<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Slide 05</title>
  <link rel="stylesheet" href="./common.css" />
</head>
<body>
  <div class="topbar"></div>
  <div class="header">
    <div class="section">질문 사다리</div>
    <div class="slide-no">05</div>
  </div>

  <div class="title" style="margin-top: 28pt;">원하는 결과는 바로 나오지 않는다</div>
  <div class="subtitle">질문을 쪼개야 비로소 내가 진짜 원하는 결과가 보인다.</div>

  <div class="split" style="margin-top: 24pt;">
    <div>
      <ul class="bullets">
        <li>조금 더 수월해졌으면 하는 장면은?</li>
        <li>그 장면이 왜 번거로운가?</li>
        <li>그 일이 잘 되면 무엇이 달라지는가?</li>
        <li>그게 왜 중요한가?</li>
        <li>당신에게 성과란 무엇인가?</li>
        <li>누가 무엇을 인정해주면 잘 된 것인가?</li>
        <li>결국 진짜 원하는 결과는 무엇인가?</li>
      </ul>
    </div>
    <div class="card blue soft-blue no-shadow">
      <div class="kicker">예시</div>
      <div class="card-title lg">보고서를 쓰는 것<br/>→<br/>상사가 방향을 한 번에 이해하는 것</div>
      <div class="card-body">겉으로 원하는 것과 진짜 원하는 결과는 다를 수 있다.</div>
    </div>
  </div>

  <div class="footer-line"></div>
</body>
</html>
