<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Slide 15</title>
  <link rel="stylesheet" href="./common.css" />
</head>
<body>
  <div class="topbar"></div>
  <div class="header">
    <div class="section">길찾아가기</div>
    <div class="slide-no">15</div>
  </div>
  <div class="tiny-rule"></div>

  <div class="split" style="margin-top: 18pt; align-items:start;">
    <div>
      <div class="title">좋은 툴보다 먼저<br/>좋은 길 설계가 필요하다</div>
      <div class="subtitle" style="margin-top: 26pt;">출발지점이 어디인지, 목표지점이 무엇인지,<br/>그리고 어떤 이동수단이 맞는지를 구분해야 한다.</div>
    </div>
    <div class="card dark no-shadow" style="padding-top:18pt;">
      <div class="kicker">핵심 질문</div>
      <div class="card-title">지금 나는 어디에 있고<br/>어디로 가려는가</div>
      <div class="card-body">
        출발지점<br/>
        목표지점<br/>
        이동수단<br/>
        운용 기준<br/><br/>
        이 네 가지가 정리되면 도구는 훨씬 덜 헷갈린다.
      </div>
    </div>
  </div>
  <div class="footer-line"></div>
</body>
</html>
